<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - My Page v2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">

    <section>
      <h2>ติดต่อฉัน</h2>
      <p>กรอกข้อมูลด้านล่างเพื่อส่งข้อความถึงฉัน</p>

      <form action="#" method="post">
        <label for="fullname">ชื่อ - นามสกุล</label>
        <input type="text" id="fullname" name="fullname" placeholder="เช่น สมชาย ใจดี" required>

        <label for="email">อีเมล</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="phone">เบอร์โทรศัพท์</label>
        <input type="tel" id="phone" name="phone" placeholder="0812345678">

        <label for="subject">หัวข้อ</label>
        <select id="subject" name="subject">
          <option value="general">สอบถามทั่วไป</option>
          <option value="work">ร่วมงาน</option>
          <option value="other">อื่น ๆ</option>
        </select>

        <label for="message">ข้อความ</label>
        <textarea id="message" name="message" rows="5" placeholder="พิมพ์ข้อความของคุณที่นี่..." required></textarea>

        <div class="row">
          <button type="submit" class="btn">ส่งข้อความ</button>
          <button type="reset" class="btn btn-secondary">ล้างฟอร์ม</button>
        </div>
      </form>
    </section>

    <section style="text-align:center">
      <a class="btn btn-secondary" href="index.html">← กลับหน้าหลัก</a>
    </section>

    <footer>
      <a href="https://github.com/your-username" target="_blank">GitHub</a> |
      <a href="index.html">Home</a>
      <p>&copy; 2026 My Page v2</p>
    </footer>

  </div>
</body>
</html>
